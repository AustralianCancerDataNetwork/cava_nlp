include:
  - ../omop-spires/docker/docker-compose.yaml  # Include the infrastructure services from the omop-spires setup

services:
  python-cava:
    build:
      context: .
      dockerfile: Dockerfile
    image: python-cava:latest
    volumes:
      - .:/workspace/cava-nlp:cached
      - ../omop-spires:/workspace/omop-spires:cached
      - shared_omop_venv_data:/workspace/omop-spires/.venv
      - ../omop-graph:/workspace/omop-graph:cached
      - ../OMOP_Alchemy:/workspace/OMOP_Alchemy:cached
      - ../spaczz:/workspace/spaczz:cached
      - venv_cava:/workspace/cava-nlp/.venv
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - OMOP_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-omop:5432/${POSTGRES_DB}
      - PYTHONDONTWRITEBYTECODE=1
    networks:
      - omop-net
    command: sleep infinity  # Keep the container running for development
    depends_on:
      ollama:
        condition: service_started
      db-omop:
        condition: service_healthy

volumes:
  venv_cava:
  shared_omop_venv_data:
    external: true